<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Soothing deep pine & sage gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b6e5e"/>
      <stop offset="100%" stop-color="#0a4639"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f2ee"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Soothing squircle background with soft rounded edges -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1"/>

  <!-- Calm inner ambient circle -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="rgba(217, 235, 228, 0.12)" stroke-width="0.75"/>

  <!-- Open notebook / journal icon -->
  <g filter="url(#cardShadow)">
    <!-- Left page -->
    <path d="M15.2 11.4 C12.2 10.3 9 10.7 7.5 11.4 C7.2 11.5 7 11.8 7 12.2 L7 20.8 C7 21.2 7.3 21.5 7.7 21.4 C9 20.8 12 20.4 15.2 21.6 Z" fill="url(#pageGrad)"/>
    <!-- Right page -->
    <path d="M16.8 11.4 C19.8 10.3 23 10.7 24.5 11.4 C24.8 11.5 25 11.8 25 12.2 L25 20.8 C25 21.2 24.7 21.5 24.3 21.4 C23 20.8 20 20.4 16.8 21.6 Z" fill="url(#pageGrad)" opacity="0.95"/>
    <!-- Center spine accent line -->
    <line x1="16" y1="11" x2="16" y2="21.8" stroke="#0a4639" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Editorial text lines on left page -->
    <line x1="9.5" y1="14.3" x2="13.2" y2="13.8" stroke="#75a595" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="9.5" y1="17" x2="13.2" y2="16.5" stroke="#75a595" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Editorial text lines on right page -->
    <line x1="18.8" y1="13.8" x2="22.5" y2="14.3" stroke="#75a595" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="18.8" y1="16.5" x2="22.5" y2="17" stroke="#75a595" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- Soothing warm beacon node atop the spine -->
  <circle cx="16" cy="8.5" r="1.2" fill="#efe4c8"/>
</svg>