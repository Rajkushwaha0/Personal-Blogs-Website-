<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Raj's Blogs — system design, architecture, and backend engineering deep dives."
    />
    <title>Raj's Blogs</title>
    <script>
      // Old HashRouter links (#/posts/...) → path URLs so shares keep working.
      (function () {
        var hash = window.location.hash
        if (hash && hash.charAt(1) === '/') {
          var base = '/Personal-Blogs-Website-'
          window.location.replace(base + hash.slice(1))
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
